<style>

  --green: #34C759;
  --green-bg: #E8F8ED;
  --orange: #FF9500;

  --red: #FF3B30;

body {

}

}

.search-bar input:focus {

.filters {
  max-width: 1120px;
  margin: 0 auto 28px;
  padding: 0 24px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.seg-control {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  overflow: hidden;
}

.seg-control button {
  padding: 7px 16px;
  border: none;
  background: transparent;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.seg-control button.active {
  background: var(--blue);
  color: #FFF;
}

.seg-control button:hover:not(.active) {
  color: var(--text-primary);
  background: var(--border-light);
}

.stats-row {
  max-width: 1120px;
  margin: 0 auto 28px;
  padding: 0 24px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
  text-align: center;
}

.stat-card .stat-num {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.stat-card .stat-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-top: 2px;
}

.company-list {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 24px 60px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.company-card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  overflow: hidden;
  transition: box-shadow 0.25s, border-color 0.25s;
}

.company-card:hover {
  box-shadow: var(--shadow-md);
  border-color: var(--border);
}

.card-header {
  padding: 20px 24px;
  cursor: pointer;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: start;
  user-select: none;
}

.card-header:active { opacity: 0.85; }

.card-left { min-width: 0; }

.card-name {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.card-category {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-meta {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.01em;
  white-space: nowrap;
}

.pill-stage {
  background: var(--blue-bg);
  color: var(--blue);
}

.pill-urgency-high {
  background: var(--red-bg);
  color: var(--red);
}

.pill-urgency-medium {
  background: var(--orange-bg);
  color: var(--orange);
}

.pill-urgency-low {
  background: var(--green-bg);
  color: var(--green);
}

.pill-freq {
  background: var(--purple-bg);
  color: var(--purple);
}

.pill-remote {
  background: var(--green-bg);
  color: var(--green);
}

.card-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  flex-shrink: 0;
}

.status-btn {
  padding: 6px 16px;
  border-radius: var(--radius-pill);
  border: 1.5px solid var(--border);
  background: transparent;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.status-btn:hover { border-color: var(--blue); color: var(--blue); }

.status-btn[data-status="interested"] { background: var(--blue); color: #FFF; border-color: var(--blue); }
.status-btn[data-status="applied"] { background: var(--green); color: #FFF; border-color: var(--green); }
.status-btn[data-status="rejected"] { background: var(--red); color: #FFF; border-color: var(--red); }
.status-btn[data-status="parked"] { background: var(--orange); color: #FFF; border-color: var(--orange); }

.chevron {
  width: 20px;
  height: 20px;
  color: var(--text-tertiary);
  transition: transform 0.3s;
  align-self: center;
}

.company-card.open .chevron { transform: rotate(180deg); }

.card-detail {
  display: none;
  border-top: 1px solid var(--border-light);
}

.company-card.open .card-detail { display: block; }

.detail-tabs {
  display: flex;
  gap: 0;
  padding: 0 24px;
  border-bottom: 1px solid var(--border-light);
  overflow-x: auto;
}

.detail-tabs button {
  padding: 12px 18px;
  border: none;
  background: transparent;
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  color: var(--text-tertiary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
}

.detail-tabs button.active {
  color: var(--blue);
  border-bottom-color: var(--blue);
}

.detail-tabs button:hover:not(.active) {
  color: var(--text-primary);
}

.tab-content {
  padding: 20px 24px;
}

.tab-pane { display: none; }
.tab-pane.active { display: block; }

.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

.info-item {}

.info-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 3px;
}

.info-value {
  font-size: 15px;
  color: var(--text-primary);
  line-height: 1.4;
}

.info-value a {
  color: var(--blue);
  text-decoration: none;
}

.info-value a:hover { text-decoration: underline; }

.leader-list {

  flex-direction: column;
  gap: 12px;
}

.leader-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  background: var(--bg);
  border-radius: var(--radius-sm);
}

.leader-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFF;
  font-size: 15px;
  font-weight: 600;
  flex-shrink: 0;
}

.leader-info { flex: 1; min-width: 0; }

.leader-name {
  font-size: 15px;
  font-weight: 600;
}

.leader-title {
  font-size: 13px;
  color: var(--text-secondary);
}

.leader-link {

  border-radius: var(--radius-pill);
  border: 1px solid var(--blue);
  background: transparent;
  color: var(--blue);
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  text-decoration: none;

  color: var(--text-tertiary);
  margin-bottom: 6px;

.section-block p, .section-block ul {

  line-height: 1.5;

.section-block ul {

.status-menu.show { display: block; }

.status-menu button {
  display: block;
  width: 100%;
  padding: 10px 16px;
  border: none;
  background: transparent;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
  cursor: pointer;
  text-align: left;
  transition: background 0.15s;
}

.status-menu button:hover { background: var(--border-light); }

.status-wrap { position: relative; }

.competitor-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.comp-tag {
  padding: 3px 10px;
  background: var(--bg);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-pill);
  font-size: 12px;
  color: var(--text-secondary);
}

.role-card {

.role-link {

  background: var(--blue);

  font-size: 12px;
  font-weight: 500;
  text-decoration: none;
  transition: background 0.2s;
  white-space: nowrap;
}

.role-link:hover { background: var(--blue-hover); }

@media (max-width: 700px) {
  .header { padding: 32px 16px 24px; }
  .header h1 { font-size: 28px; }
  .search-bar, .filters, .stats-row, .company-list { padding-left: 16px; padding-right: 16px; }

  .card-name { font-size: 17px; }
  .card-right { flex-direction: row; align-items: center; }

  .stats-row { grid-template-columns: repeat(2, 1fr); }
}

  {"id": 3, "name": "Leena AI", "cat": "Agentic AI / Enterprise AI / Autonomous Agents", "stage": "Scale-up", "emp": "201-500", "hq": "San Francisco, California", "founded": "2018", "website": "https://leena.ai/", "linkedin": "https://www.linkedin.com/company/leena-ai", "about": "Accelerate your Agentic AI journey with AI Colleagues for the back-office — proactive, collaborative, and outcome-driven.", "roles": ["Business Development Representative - Europe", "Business Development Representative - NAMER"], "jobUrls": ["https://www.linkedin.com/jobs/view/4447366250/", "https://www.linkedin.com/jobs/view/4447360408/"], "loc": ["Bengaluru, Karnataka, India"], "mode": ["Office"], "urgency": "High — 2 roles posted 2026-08-05", "product": "Agentic AI platform delivering AI Colleagues for enterprise back-office (HR, IT, Finance). Autonomous agents handle employee onboarding, service delivery, knowledge management, ITSM, and generative AI workflows. Launched 'AI Colleague Studio' for enterprise agent customization in Oct 2025.", "icp": "Large enterprises (Fortune 500, 10,000+ employees) with complex HR/IT service delivery needs; companies wanting to automate repetitive back-office workflows; global enterprises with ITSM modernization mandates.", "funding": "$40.1M across 4 rounds. Series B (September 2021). Bessemer Venture Partners, Greycroft, Liquid 2 Ventures", "revenue": "Not publicly disclosed (201-500 employees)", "competitors": ["Kore.ai", "Atomicwork", "Ema", "Moveworks", "ServiceNow HRSD", "Rezolve.ai", "Microsoft Copilot for M365"], "news": "October 2025: Launched AI Colleague Studio for enterprise agent customization. Atomicwork (competitor) raised funding in Sept 2025.", "gtmMotion": "Enterprise Sales (Complex/Consultative). Selling to Fortune 500 CHROs, CIOs, and IT service leaders. Two dedicated BDR roles (Europe, NAMER) signal geographic expansion with separate territory-based SDR motion. Agentic AI positioning is differentiator in crowded HR chatbot market.", "salesMotion": "Outbound (BDR-led) + inbound (event/content marketing). Complex, multi-stakeholder enterprise deals (CHRO + CIO + IT). Long 6-18 month cycles. Proof of value via pilot engagements. Two BDRs hired simultaneously for EU + US suggest coordinated scaling push.", "gaps": ["Series B funded in 2021 (5 years ago) — burn rate pressure likely driving current hiring push", "Agentic AI market is heating up — window to capture enterprise before Microsoft Copilot dominates", "Simultaneous EU + NAMER BDR hires from India suggests resource optimization over local presence"], "outreach": "Position as: 'Leena AI is hiring BDRs for both Europe and NAMER simultaneously — this is a coordinated GTM push. Your target buyer is CHRO/CIO at 5,000+ employee enterprises. The AI Colleague framing is differentiated from Copilot because it's back-office specific. Lead with ROI stories from Fortune 500 deployments.'", "leaders": [{"name": "Adit Jain", "title": "Co-Founder & CEO", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/adit-jain-leena-ai"}, {"name": "Anand Prajapati", "title": "Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/anand-prajapati"}, {"name": "Mayank Goyal", "title": "Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/mayankzuppit"}, {"name": "Shravan Shet", "title": "Sr. Manager, Sales Development", "cat": "head_sales", "li": "https://www.linkedin.com/in/shravanshet"}]},
  {"id": 4, "name": "TestGrid.io", "cat": "DevTools / QA Test Automation / Device Cloud", "stage": "Startup", "emp": "51-200", "hq": "Atlanta, GA", "founded": "2015", "website": "https://www.testgrid.io", "linkedin": "https://www.linkedin.com/company/testgrid-io", "about": "End to End Cloud, and On-Prem Testing Solution", "roles": ["Sales Development Representative"], "jobUrls": ["https://www.linkedin.com/jobs/view/4449435129/"], "loc": ["Hyderabad, Telangana, India"], "mode": ["Unknown"], "urgency": "Medium", "product": "End-to-end cloud and on-premise test automation platform. Covers mobile app testing (iOS/Android), API automation, IoT testing, device cloud, and test case management. Offers AI-powered test generation (CoTester). Targets QA and engineering teams needing unified testing infrastructure.", "icp": "QA and engineering teams at software product companies; mobile app developers needing device cloud testing; enterprises with IoT products requiring hardware/software testing; fintech and healthcare companies with compliance testing needs.", "funding": "Undisclosed Seed round (August 2023). Seed (August 2023)", "revenue": "Not publicly disclosed (51-200 employees)", "competitors": ["BrowserStack", "Tricentis", "SmartBear", "UiPath Agentic Automation", "Panaya", "Sauce Labs", "LambdaTest"], "news": "2025: Won Global Recognition Award. Launched CoTester (AI test generation). Ranked 6th among 58 active competitors in test automation space.", "gtmMotion": "Inside sales + freemium/trial conversion. SDR role in Hyderabad (unknown mode — likely office or hybrid). Targeting QA leads and engineering managers at software product companies.", "salesMotion": "Inbound-heavy (G2 reviews, comparison pages) + outbound SDR for enterprise upsell. Demo-driven. Technical buyer (QA Engineer, SDET, QA Manager, VP Engineering). Competed on device coverage, AI test generation, and price.", "gaps": ["Low brand awareness vs. BrowserStack (which dominates India SaaS QA market)", "Hyderabad-based SDR pool is smaller than Bengaluru/Mumbai for SaaS sales talent", "Unclear if company has enterprise AE capacity to work qualified leads from SDR"], "outreach": "Position as: 'TestGrid won the 2025 Global Recognition Award and is building its first outbound motion. Your ICP is QA leads and engineering managers at software companies. Lead with the end-to-end platform story vs. BrowserStack's device-only play — TestGrid does device cloud + AI test generation + test management in one.'", "leaders": [{"name": "Harry Rao", "title": "CEO & Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/harryceotestgrid"}, {"name": "Yassine Sbiti", "title": "CIO & Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/yassine-sbiti-866336"}, {"name": "Sachin R", "title": "Co-Founder", "cat": "founder_ceo", "li": null}]},
  {"id": 5, "name": "Skydo", "cat": "FinTech SaaS / Cross-border B2B Payments", "stage": "High Growth Startup", "emp": "51-200", "hq": "Bengaluru, Karnataka", "founded": "2022", "website": "https://skydo.com", "linkedin": "https://www.linkedin.com/company/skydo-official", "about": "We are a global fintech startup making cross-border B2B payments hassle-free, and reducing forex charges for businesses by more than 50%. By partnering with leading banks across the globe, we provide businesses with their own foreign virtual accounts for receiving payments - without any taxation or compliance burdens.", "roles": ["Business Development Representative"], "jobUrls": ["https://www.linkedin.com/jobs/view/4448931774/"], "loc": ["Bengaluru, Karnataka, India"], "mode": ["Office"], "urgency": "High — posted 2026-08-05", "product": "Cross-border B2B payments platform for Indian exporters. Provides virtual foreign accounts in 10+ countries, accepts payments in 32+ currencies from 150+ countries, converts at live mid-market FX rate with zero markup and a flat transaction fee. 24-hour settlement to Indian bank accounts. No taxation or compliance burden on the exporter.", "icp": "Indian exporters (SaaS companies, agencies, freelancers, manufacturers) receiving international B2B payments. Typical customer: SMB or startup exporter wanting to cut 50%+ in forex charges vs. traditional banks.", "funding": "$19.7M across 3 rounds. $10M Series A (December 2025). Susquehanna Asia Venture Capital, Elevation Capital", "revenue": "$850M+ annualized payment volume; 40,000+ businesses (revenue not disclosed)", "competitors": ["PayPal", "Wise Business", "Payoneer", "Razorpay Opfin", "Infinity", "traditional Indian banks"], "news": "September 2025: Partnership with Veem to power seamless USD collections for Indian businesses. December 2025: Closed $10M Series A.", "gtmMotion": "Bottom-up PLG + BDR Outbound. Self-serve signup (5-minute account creation) for individual exporters and SMBs. BDR for mid-market Indian exporters (agencies, SaaS companies) with $100K+ monthly international receipts.", "salesMotion": "BDR-led outbound targeting finance heads, founders, and CFOs of Indian SMBs receiving US/EU payments. Selling against: 'We're cheaper than PayPal, faster than traditional banks, simpler than Payoneer.' High-velocity, transactional sales with clear ROI (50%+ forex cost reduction).", "gaps": ["40,000 businesses is strong base but conversion from SMB to mid-market requires different motion", "Cross-border payments is crowded — Wise, PayPal, Payoneer all have larger budgets", "Partnership with Veem (Sept 2025) suggests channel as secondary GTM lever — not yet scaled"], "outreach": "Position as: 'Skydo just closed a $10M Series A to accelerate its BDR motion. Your ICP is Indian exporters (SaaS, agencies, freelancers) doing $100K+ international business. The message writes itself: zero forex markup + virtual foreign accounts + 24-hour settlement. Lead with the cost savings calculator.'", "leaders": [{"name": "Srivatsan Sridhar", "title": "CEO & Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/srivats80"}, {"name": "Movin Jain", "title": "Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/movinjain"}, {"name": "Atul Mohan", "title": "Head of Sales", "cat": "head_sales", "li": null}, {"name": "Abhilove Sharda", "title": "Head of Finance", "cat": "other", "li": "https://www.linkedin.com/in/abhilove-sharda"}]},
  {"id": 6, "name": "Cube", "cat": "AI Marketing SaaS / Demand Generation", "stage": "Startup", "emp": "51-200", "hq": "Palo Alto, California", "founded": "2023", "website": "https://www.cubehq.ai/", "linkedin": "https://www.linkedin.com/company/cubehqai", "about": "The future of AI-powered digital marketing.", "roles": ["Sales Development Representative"], "jobUrls": ["https://www.linkedin.com/jobs/view/4446678607/"], "loc": ["Bengaluru, Karnataka, India"], "mode": ["Office"], "urgency": "Medium", "product": "AI-powered digital marketing platform for multi-location businesses. Automates SEO, paid ads (Google/Meta), social media, email marketing, and online review management from a single dashboard. Built by Stanford/Wharton/IIT alumni. AI agents run and optimize campaigns 24/7.", "icp": "Multi-location brick-and-mortar businesses (restaurants, retail chains, healthcare clinics, real estate); local SMBs wanting AI-driven marketing without in-house expertise. US and India markets.", "funding": "$2.2M across 2 rounds. Seed/Early (2020). Surge Ventures, 2 undisclosed", "revenue": "Not publicly disclosed (51-200 employees, 164 per ZoomInfo)", "competitors": ["Vendasta", "Broadly", "SOCi", "Yext", "Birdeye", "AI marketing automation platforms"], "news": "2025: Expanded Bengaluru office; actively scaling SDR team in India for US market outreach.", "gtmMotion": "Outbound Sales + Marketplaces. SDR-led outbound from Bengaluru targeting US multi-location businesses. Selling AI marketing automation to local businesses and chains. India team sells into US market.", "salesMotion": "Outbound cold outreach to US multi-location businesses (restaurants, retail, healthcare clinics). SDR in Bengaluru office. Demo-driven selling. Monthly recurring revenue model. Position: cheaper than a marketing agency with better ROI from AI.", "gaps": ["Digital marketing is extremely crowded — differentiation vs. Yext, Vendasta, SOCi must be crystal clear", "Multi-location business outreach from India requires strong data sourcing and US time zone coverage", "SDR role may be among first outbound hires — no established playbook yet"], "outreach": "Position as: 'Cube is an AI-first digital marketing platform for multi-location businesses, built by Stanford/IIT founders. Your ICP is US multi-location business owners (restaurants, clinics, retail) who are paying agencies too much. The SDR motion is new — help establish the outbound playbook early and grow with the company.'", "leaders": [{"name": "Suhail Abidi", "title": "Co-Founder & CEO", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/suhailabidi"}, {"name": "Ashish Ranjan", "title": "Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/ashishiitkgp"}, {"name": "Abhinav Gupta", "title": "Co-Founder", "cat": "founder_ceo", "li": null}]},
  {"id": 7, "name": "KYC Hub", "cat": "RegTech SaaS / KYC-AML Compliance", "stage": "High Growth Startup", "emp": "51-200", "hq": "London, London", "founded": "2019", "website": "https://www.kychub.com/", "linkedin": "https://www.linkedin.com/company/kychub", "about": "Configurable, modular, and automated infrastructure for global KYC/AML compliance, fraud detection and onboarding. KYC Hub enables organizations to mitigate the risk of financial crime and reduce costs by automated and configurable risk ops infrastructure and better data insights.", "roles": ["Sales Development Representative"], "jobUrls": ["https://www.linkedin.com/jobs/view/4447346880/"], "loc": ["India (Remote)"], "mode": ["Remote (India)"], "urgency": "High — posted 2026-08-05", "product": "Configurable, modular KYC/AML compliance platform. RPA-powered workflow engine for onboarding and due diligence; AI-enabled verifications; proprietary knowledge graph for individuals and entities; sanctions screening, PEP checks, IDV, KYB, address verification. Enables end-to-end risk ops infrastructure.", "icp": "Financial institutions, fintechs, crypto/Web3 companies, and payment processors needing automated KYC/AML compliance. Regulated industries (banks, insurance, wealth management) with global compliance requirements.", "funding": "Undisclosed (estimated <$10M based on 51-200 employees and $1-10M revenue range). Unknown", "revenue": "$1-10M range (per LeadIQ/SignalHire)", "competitors": ["AiPrise", "Onfido", "Jumio", "Sumsub", "ComplyAdvantage", "CleverChain", "Salv", "Muinmos"], "news": "Named in Top 10 KYC Solutions in RegTech for 2026 (Fintech Global). Won 'Best PEP and Sanctions Solution' by Regtech Insights USA.", "gtmMotion": "Enterprise Sales (Outbound + Compliance Events). SDR targets compliance officers and heads of financial crime at banks, fintechs, and crypto platforms. Remote India SDR suggests cost-efficient outbound to UK/EU/APAC markets.", "salesMotion": "Outbound SDR + compliance conference presence. Technical, complex sale (60-180 day cycles). Decision maker: Chief Compliance Officer, Head of AML, Chief Risk Officer. Proof via demo + sandbox environment. Multi-stakeholder (compliance + IT + legal).", "gaps": ["India SDR covering APAC + potentially UK/EU must navigate complex regulatory differences per market", "Buyer (Chief Compliance Officer) is highly risk-averse — needs strong proof and reference customers", "Competing vs. Jumio, Onfido (backed by Entrust) requires clear differentiation on configurability"], "outreach": "Position as: 'KYC Hub is a RegTech100 award winner expanding APAC coverage with a remote India SDR. Your buyer is Chief Compliance Officer / Head of AML at banks and fintechs. Lead with the 'configurable + modular' story vs. monolithic KYC platforms — buyers are tired of locked-in vendors. Case studies from UK RegTech awards are your credibility anchor.'", "leaders": [{"name": "Farnoush Mirmoeini", "title": "CEO & Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/farnoush"}, {"name": "Jay Rao", "title": "Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/jayrao1"}]},
  {"id": 8, "name": "apna", "cat": "HR Tech SaaS / Early Talent Hiring Platform", "stage": "Scale-up", "emp": "1001-5000", "hq": "Bengaluru, Karnataka", "founded": "2019", "website": "https://apna.co", "linkedin": "https://www.linkedin.com/company/apnahq", "about": "India's largest early talent hiring & jobs platform", "roles": ["Lead Sales Development Representative"], "jobUrls": ["https://www.linkedin.com/jobs/view/4448958169/"], "loc": ["Bengaluru, Karnataka, India"], "mode": ["Office"], "urgency": "High — posted 2026-08-05", "product": "India's largest early talent hiring and jobs platform. AI-powered marketplace connecting blue-collar, gray-collar, and entry-level job seekers to employers. Features automated candidate sourcing, AI matching, job posting, community networking, and skilling. 1,001-5,000 employees; unicorn status.", "icp": "Indian companies hiring at scale for entry-level, frontline, and blue-collar roles; HR teams at manufacturing, retail, BFSI, and logistics companies; SMBs and enterprises with high-volume hiring needs in India.", "funding": "$194M. Series C. Tiger Global Management, Peak XV Partners (formerly Sequoia India), Insight Partners", "revenue": "Not publicly disclosed (valuation $1.1B; 745 employees as of Aug 2025)", "competitors": ["LinkedIn India", "foundit (Naukri)", "WorkIndia", "Vahan", "Gigforce", "MyKaam", "Glassdoor"], "news": "2025: Appointed Kartik Narayan as CEO of Jobs Marketplace vertical. Headcount at 745 (Aug 2025), down 6% YoY.", "gtmMotion": "Inside Sales + Platform Self-Serve. Employers self-serve to post jobs; B2B SDR/sales team sells enterprise job posting packages and employer branding solutions to large companies. Expanding into SaaS HR tool territory (ATS, assessment).", "salesMotion": "Lead SDR (senior role) managing outbound to HR leaders and talent acquisition heads at large Indian enterprises. Selling job posting credits, employer branding packages, and enterprise hiring solutions. Multi-product pitch (jobs + skilling + community).", "gaps": ["Apna's brand is strong for blue-collar hiring but enterprise white-collar HR decision-makers may perceive it as 'mass market'", "Unicorn with declining headcount (-6% YoY) may signal internal restructuring — could affect SDR enablement", "Platform is a marketplace — B2B monetization is complex when supply side (job seekers) is free"], "outreach": "Position as: 'apna is India's largest early talent platform, a unicorn hiring a Lead SDR to scale enterprise sales. Your ICP is TA Head / HR Director at companies with 100+ entry-level hires per month. The story is India's fastest-growing workforce discovery platform vs. legacy job boards like Naukri. This is a senior role — you'll be building the SDR motion, not just executing it.'", "leaders": [{"name": "Nirmit Parikh", "title": "Founder & Group CEO", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/nirmit-parikh"}, {"name": "Kartik Narayan", "title": "CEO - Jobs Marketplace", "cat": "head_sales", "li": "https://www.linkedin.com/in/kartik"}]},
  {"id": 9, "name": "Salesforce", "cat": "CRM / Enterprise Cloud SaaS", "stage": "Enterprise", "emp": "10001+", "hq": "San Francisco, California", "founded": null, "website": "http://www.salesforce.com", "linkedin": "https://www.linkedin.com/company/salesforce", "about": "We're the #1 AI CRM—where humans with agents drive customer success together with AI, data, and Customer 360 apps on one platform.", "roles": ["Sales Development Representative"], "jobUrls": ["https://www.linkedin.com/jobs/view/4448867769/"], "loc": ["Bengaluru, Karnataka, India"], "mode": ["Office"], "urgency": "Medium — enterprise standard hiring", "product": "World's #1 AI CRM platform. Customer 360 suite: Sales Cloud, Service Cloud, Marketing Cloud, Commerce Cloud, Slack, MuleSoft, Tableau, Agentforce. Powers human + AI agent collaboration across the customer lifecycle. 200,000+ customers globally.", "icp": "Enterprises and mid-market companies globally needing CRM, sales automation, customer service, marketing automation, and data analytics. India focus: tech companies, BFSI, manufacturing, telecom.", "funding": "Public company (NYSE: CRM). N/A. Public", "revenue": "$34B+ ARR (FY2025)", "competitors": ["HubSpot", "Microsoft Dynamics 365", "SAP CRM", "Oracle CRM", "Zendesk", "Freshworks"], "news": "2026: India Managing Director for Sales appointed (Mankiran Chowhan). Arundhati Bhattacharya leads South Asia. Agentforce AI agent platform driving enterprise AI adoption.", "gtmMotion": "Full-funnel Enterprise Sales. Global machine: Marketing (events, content, Trailhead) → SDR/BDR → AE → Solutions Engineering → CSM. India SDR team focused on building pipeline for India and APAC enterprise accounts across Salesforce product suite (CRM, Service Cloud, Agentforce).", "salesMotion": "Structured SDR-AE model with territories. SDR generates qualified meetings; AE closes complex multi-product enterprise deals (6-18 months). Bengaluru SDR team targets India enterprise accounts. Strong inbound (brand) + outbound (SDR-led). Agentforce AI push is current narrative.", "gaps": ["Salesforce's scale means SDR roles are well-defined but pipeline targets can be aggressive in India market", "Agentforce is the current GTM priority — SDRs must retool messaging from 'CRM' to 'AI agents'", "Competition from Microsoft Dynamics + Copilot is strongest in India enterprise market"], "outreach": "Position as: 'Salesforce India is hiring SDRs as Agentforce changes the enterprise AI conversation. Your ICP is VP Sales, CIO, or Digital Transformation Lead at Indian enterprises. The SDR pitch is now AI agents + CRM — not just CRM. Established brand means strong inbound but targets require consistent outbound too.'", "leaders": [{"name": "Marc Benioff", "title": "CEO & Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/marcbenioff"}, {"name": "Arundhati Bhattacharya", "title": "President & CEO, Salesforce South Asia", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/arundhati-bhattacharya-salesforce"}, {"name": "Mankiran Chowhan", "title": "Managing Director, Sales & Distribution, India", "cat": "vp_sales", "li": "https://www.linkedin.com/in/mankiran-chowhan-877414"}]},
  {"id": 10, "name": "Keka HR", "cat": "HR Tech SaaS / HRMS / Payroll", "stage": "Scale-up", "emp": "501-1000", "hq": "Seattle, Washington", "founded": "2015", "website": "https://www.keka.com", "linkedin": "https://www.linkedin.com/company/keka-hr", "about": "On a mission to create awesome employee experiences!", "roles": ["Sales Development Representative", "Sales Development Representative (US Market)"], "jobUrls": ["https://www.linkedin.com/jobs/view/4448871188/", "https://www.linkedin.com/jobs/view/4448858493/"], "loc": ["Bengaluru, Karnataka, India"], "mode": ["Office"], "urgency": "High — 2 roles posted 2026-08-04", "product": "Modern HRMS and payroll platform built for Indian businesses. Covers payroll, attendance, leaves, performance management, recruitment (ATS), expense management, and employee engagement — all in one platform. Positioned as 'India's fastest-growing HRMS.' 10,000+ customers; bootstrapped for years before raising.", "icp": "Indian SMBs and mid-market companies (100-2000 employees) replacing legacy HR tools (Spine, Greyt, Excel). IT companies, services firms, manufacturing, and retail chains across India and some Southeast Asia markets.", "funding": "$59.2M across 3 rounds. $57M Series A led by WestBridge Capital. WestBridge Capital", "revenue": "$52.5M ARR (2025)", "competitors": ["Darwinbox", "greytHR", "Zoho People", "PeopleStrong", "HRMantra", "Workday", "SumoPayroll", "Nitso HRMS"], "news": "2025: VP Sales Dheeraj Kumar Pandey cited in media. Expanding US market with dedicated SDR team from Bengaluru. 10,000+ businesses across 1,572 customers in India alone.", "gtmMotion": "Product-Led Growth + SDR-led Outbound. Freemium/trial for SMBs; outbound SDR for mid-market and US market. India SDR selling both India mid-market AND US market simultaneously (two roles). Strong Glassdoor/G2 reputation drives inbound; SDR converts and pushes enterprise accounts.", "salesMotion": "High-velocity inside sales + structured outbound. SDR generates demos with HR Directors, COOs, and Founders at 200-2000 employee companies. India SDR + US Market SDR hired simultaneously — dual-market strategy. Short sales cycles (30-90 days) for India SMBs; longer for US mid-market.", "gaps": ["US market entry from Bengaluru office creates timezone gap (approx 10.5 hours behind EST) — call windows are narrow", "US market needs different positioning than India (Keka is unknown in US vs. well-known in India)", "Two different markets, one office — SDR training and coaching must be bifurcated"], "outreach": "Position as: 'Keka HR is India's fastest-growing HRMS ($52.5M ARR) scaling the US market from Bengaluru. You'll be one of the first SDRs targeting US companies — similar ICP (SMB to mid-market HR leaders) but different culture and tools. The US pitch: affordable Workday alternative with strong UX and India support quality.' Lead VP Sales Dheeraj Pandey and Chad Chitresh (EU/GCC head) as sales leaders to align with.", "leaders": [{"name": "Vijay Yalamanchili", "title": "Founder & CEO", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/yalamanchili"}, {"name": "Dheeraj Kumar Pandey", "title": "VP Sales", "cat": "vp_sales", "li": "https://www.linkedin.com/in/dheerajkpandey"}, {"name": "Chad Nagwann Chitresh", "title": "Head of Sales - Europe & GCC", "cat": "head_sales", "li": null}]},
  {"id": 11, "name": "Avalara", "cat": "Tax Compliance SaaS / FinTech / RegTech", "stage": "Enterprise", "emp": "1001-5000", "hq": "Pune, Maharashtra", "founded": null, "website": "https://www.avalara.com", "linkedin": "https://www.linkedin.com/company/avalara-apac", "about": "Avalara is the agentic AI platform for global tax and compliance. For over two decades, we've built one of the most expansive libraries of tax content and integrations in the industry. We process more than 54 billion transactions annually and support 200,000+ direct and indirect customers globally.", "roles": ["Sales Development Representative"], "jobUrls": ["https://www.linkedin.com/jobs/view/4448852602/"], "loc": ["Pune, Maharashtra, India"], "mode": ["Unknown"], "urgency": "Medium", "product": "Agentic AI platform for global tax and compliance. Automates sales tax calculations, return filings, exemption certificate management, e-invoicing, and cross-border compliance. Processes 54B+ transactions annually. Integrates with 1,200+ ERP, ecommerce, and accounting platforms. India: GST, e-way bills, e-invoicing.", "icp": "Mid-market to enterprise ecommerce, SaaS, retail, and manufacturing companies with complex multi-jurisdiction tax compliance. India focus: large enterprises needing GST automation and e-invoicing compliance.", "funding": "Acquired by Thomas H. Lee Partners (2022, ~$8.4B); previously public (NASDAQ: AVLR). Acquired/Private. Thomas H. Lee Partners", "revenue": "$800M+ (pre-acquisition estimate); $1,001-5,000 employees", "competitors": ["Vertex", "TaxJar (Stripe)", "Thomson Reuters ONESOURCE", "SAP Indirect Tax", "Sovos"], "news": "July 2025: Named new CMO and CIO. 2026: APAC India office in Pune expanding with SDR roles. Positioning as 'agentic AI platform' for compliance.", "gtmMotion": "Enterprise Sales + Partner Channel. Direct SDR → AE motion for direct enterprise accounts. Heavy partner/reseller channel through ERP and ecommerce platform integrations (1,200+ connectors). India SDR likely supporting both direct outbound and partner-sourced leads.", "salesMotion": "Structured enterprise SDR → AE model. SDR in Pune targeting India enterprise accounts with complex tax compliance needs (GST, e-invoicing). Long sales cycles (90-180 days). Decision maker: CFO, Tax Director, IT Director. Compliance mandate creates urgency (regulatory driver).", "gaps": ["Avalara went private (2022) — reduced public profile may make outbound harder without the public company credibility", "India GST e-invoicing mandate is strong regulatory tailwind but creates crowded competitive moment", "Pune-based SDR in India (not Bengaluru) suggests smaller talent pool for SaaS sales"], "outreach": "Position as: 'Avalara is the global leader in tax automation ($800M+ revenue, 200K+ customers, acquired for $8.4B) expanding India SDR capacity as GST e-invoicing mandates create urgency. Your ICP is CFO and Tax Directors at large Indian enterprises with multi-state GST complexity. Regulatory pressure = urgency = shorter sales cycles than typical enterprise.'", "leaders": [{"name": "Scott McFarlane", "title": "Co-Founder & CEO", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/mcfarlanescott"}, {"name": "Sean Flynn", "title": "SVP Global Sales", "cat": "vp_sales", "li": "https://www.linkedin.com/in/seanflynn94"}, {"name": "Kimberly Deobald", "title": "Chief Revenue Officer", "cat": "vp_sales", "li": "https://www.linkedin.com/in/kimberlydeobald"}]},
  {"id": 12, "name": "Fibr AI", "cat": "AI Marketing SaaS / Website Personalization / CRO", "stage": "Startup", "emp": "11-50", "hq": "San Francisco, California", "founded": "2023", "website": "https://www.fibr.ai", "linkedin": "https://www.linkedin.com/company/fibrai", "about": "Fibr AI is an agentic website optimization platform that transforms websites into adaptive, revenue-driving experiences. Built for enterprise scale, Fibr connects marketing intent to on-site performance through deep integration with leading analytics, advertising, and CRM platforms.", "roles": ["Sales Development Representative"], "jobUrls": ["https://www.linkedin.com/jobs/view/4448518342/"], "loc": ["Bengaluru, Karnataka, India"], "mode": ["Office"], "urgency": "High — posted 2026-08-04", "product": "Agentic website optimization platform (CRO). Three AI agents — LIV (1:1 personalization), MAX (automated A/B testing), AYA (24/7 performance monitoring) — transform websites into revenue-driving adaptive experiences. Integrates with GA4, GTM, Salesforce, Adobe, Google Ads, Meta. SOC 2 + ISO 27001 certified.", "icp": "Enterprise marketing teams at Fortune 50 banks, fintech, telecom, and healthcare companies needing personalization at scale without dev resources. CMOs and growth leaders with high website traffic who can't optimize fast enough manually.", "funding": "$9.5M across 3 rounds. $1.8M seed led by Accel (for CRO Agents launch). Accel, 12 other investors", "revenue": "Not publicly disclosed (11-50 employees)", "competitors": ["Optimizely", "VWO", "Adobe Target", "Webflow", "Unbounce", "Dynamic Yield (Mastercard)", "Ninetailed"], "news": "2025: Launched AI-Agents for CRO (Yahoo Finance / PRNewswire). Raised $1.8M from Accel for CRO Agents Workforce. Trusted by Fortune 50 banks.", "gtmMotion": "Outbound Enterprise Sales. SDR-led outbound targeting enterprise marketing teams. Bengaluru India SDR selling into Fortune 500 US/EU enterprises (banking, fintech, telecom, healthcare). Early-stage product ($9.5M raised) investing in outbound as primary acquisition channel.", "salesMotion": "Outbound SDR → marketing/growth leader AE. Complex, multi-stakeholder sale (CMO, VP Marketing, Head of Digital, CDO). 60-180 day cycles for enterprise. POC-heavy with website traffic data as proof. Selling 'replace your agency + your Optimizely + your personalization team with one platform'.", "gaps": ["Seed stage company selling to Fortune 50 — credibility and proof gap in early outbound conversations", "Enterprise marketing buyers are inundated with AI CRO tools — SDR message must cut through noise", "SOC 2 + ISO 27001 certifications help with security questionnaires but procurement cycles remain long"], "outreach": "Position as: 'Fibr AI is an Accel-backed startup trusted by Fortune 50 banks for AI website personalization — 1:1 pages for every visitor, automated A/B testing, 24/7 monitoring, no dev required. The SDR role is selling to enterprise CMOs and VP Marketing — SOC2/HIPAA compliance is your security card with regulated industries. Lead with case studies and speed-to-value.'", "leaders": [{"name": "Ankur Goyal", "title": "CEO & Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/ankurgoyal22"}, {"name": "Pritam Roy", "title": "Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/pritamroy1"}]},
  {"id": 13, "name": "QCraft AI", "cat": "AI / Autonomous Driving / Enterprise AI Solutions", "stage": "Startup", "emp": "501-1000", "hq": null, "founded": "2019", "website": "https://www.qcraft.ai/en", "linkedin": "https://www.linkedin.com/company/qcraft", "about": "Empower a Brighter Future with Safe and Beneficial AI.", "roles": ["Senior Business Development Representative"], "jobUrls": ["https://www.linkedin.com/jobs/view/4446658513/"], "loc": ["Bengaluru, Karnataka, India"], "mode": ["Office"], "urgency": "Medium", "product": "Physical AI and autonomous driving platform. Develops AI algorithms for L2++ ADAS and L4 autonomous driving. Products include NOA (Navigate on Autopilot), 500+ TOPS autonomous driving solutions, and world model-based physical AI for vehicles. In 1M+ mass production units across 10 OEM partners.", "icp": "Automotive OEMs and automotive electronics/Tier-1 suppliers needing autonomous driving AI; mobility companies wanting to deploy NOA features. Primary market: Chinese auto OEMs with global expansion.", "funding": "$100M Series D (March 2026) + prior rounds (total ~$400M estimated). $100M Series D (March 2026). Ningbo Ninghai Xingtaihe Fund, Wonderland Capital, Liangxi Science and Innovation Fund", "revenue": "Not publicly disclosed (501-1000 employees; hardware+software B2B model)", "competitors": ["Mobileye", "Waymo", "Pony.ai", "Cruise", "Innoviz", "Horizon Robotics", "Momenta"], "news": "January 2026: Launched next-gen 500+ TOPS autonomous driving solution, scaled NOA to 1M+ vehicles. March 2026: Closed $100M Series D. April 2026: CEO at Munich conference on Physical AI shift.", "gtmMotion": "B2B Enterprise Sales (Automotive). Selling AI/ADAS technology to automotive OEM engineering teams and Tier-1 suppliers. India BDR likely targeting Indian auto OEMs (Tata Motors, Mahindra, Maruti/Suzuki) or Indian tech teams of global OEMs (Bosch India, Continental India, etc.).", "salesMotion": "Complex enterprise B2B sales to automotive R&D/engineering decision makers (VP Autonomous Driving, CTO, Head of ADAS). Very long cycles (12-36 months). Proof via pilot programs. India footprint growing post-Series D ($100M raised March 2026).", "gaps": ["China-founded company (QCraft) selling autonomous driving to Indian OEMs — requires trust-building in a geopolitically sensitive space", "Automotive deal cycles (12-36 months) make SDR/BDR ROI very delayed", "India autonomous driving market is earlier stage than China/US — OEM budgets may be limited"], "outreach": "Position as: 'QCraft AI raised $100M in Series D (March 2026) and is building India sales. 1M+ mass-produced vehicles already running their technology. India BDR targets automotive OEM tech teams and Tier-1 supplier engineering leads. Long-cycle, relationship-driven enterprise selling — this is a BizDev role as much as sales.'", "leaders": [{"name": "Dr. James Yu (Yu Qian)", "title": "CEO & Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/qian-yu-a644b94"}]},
  {"id": 14, "name": "Trovex.ai", "cat": "Sales Enablement SaaS / AI Sales Training / Conversational AI", "stage": "Startup", "emp": "11-50", "hq": "Bangalore, Karnataka", "founded": "2023", "website": "https://trovex.ai", "linkedin": "https://www.linkedin.com/company/trovexai", "about": "AI-powered sales and support enablement platform. Practice. Analyze. Win.", "roles": ["Sales Development Representative - Enterprise Sales"], "jobUrls": ["https://www.linkedin.com/jobs/view/4446285345/"], "loc": ["Mumbai, Maharashtra, India"], "mode": ["Office"], "urgency": "Medium", "product": "AI-powered sales and support enablement platform. Offers immersive roleplay simulations for sales teams, post-call analytics, AI coaching, performance dashboards, and real-time agent assist. Targets enterprise sales readiness. Available on Microsoft AppSource. Founded by serial entrepreneur (Gympik founder) and IISc AI researcher.", "icp": "Enterprise sales teams, customer-facing teams (sales, support, collections) needing structured training and coaching. BFSI, SaaS, and B2B companies with large field/inside sales teams in India.", "funding": "Unfunded (bootstrapped)", "revenue": "Not publicly disclosed (11-50 employees, 2023 founding)", "competitors": ["Second Nature (raised $22M Oct 2025)", "Demodesk", "Brainshark", "SmartWinnr", "Mindtickle", "Quantified", "Seismic"], "news": "2025: Listed on Microsoft AppSource. Press coverage on bringing AI sales training to India's enterprise market (CXOToday). Hiring enterprise sales SDRs in Mumbai.", "gtmMotion": "Direct Enterprise Sales. SDR-led outbound from Mumbai targeting enterprise B2B sales and customer support teams. India-first company going after large banks, BFSI, and enterprise SaaS companies with big customer-facing teams.", "salesMotion": "Outbound SDR targeting Head of Sales, VP Sales, Chief Revenue Officer at enterprises with large sales teams (50+ reps). Demo-driven with AI roleplay simulation as the hook. Short-to-medium sales cycles (30-90 days) at smaller deal sizes initially, scaling to enterprise contracts.", "gaps": ["Bootstrapped with no institutional funding — buyers may ask about company viability/longevity", "Competing vs. well-funded Second Nature, Mindtickle, Seismic with much larger GTM budgets", "Mumbai SDR focused on BFSI — sales training is different per vertical (bank vs. SaaS vs. pharma)"], "outreach": "Position as: 'Trovex.ai is the only AI sales training platform built specifically for Indian enterprises — immersive roleplay simulations for bank branch sales, insurance agents, and B2B SaaS reps. Bootstrapped and profitable. Enterprise SDR in Mumbai targeting BFSI VP Sales and L&D leaders. The competitive edge: IISc AI research + real-time coaching feedback.'", "leaders": [{"name": "Amaresh Ojha", "title": "Co-Founder & CEO", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/amaresh-ojha"}, {"name": "Srinivas Dhruv Shindhe", "title": "Co-Founder (AI Research)", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/dhruv-shindhe-4b90b11a5"}, {"name": "Abhinav Sharma", "title": "Lead - Business Development", "cat": "head_sales", "li": null}]},
  {"id": 15, "name": "Tuskr", "cat": "DevTools SaaS / QA Test Case Management", "stage": "Startup", "emp": "51-200", "hq": "Pune, Maharashtra", "founded": null, "website": "http://www.tuskr.app", "linkedin": "https://www.linkedin.com/company/tuskr", "about": "Our QA testing software is power-packed with everything you want, and nothing that you don't.", "roles": ["Sales Development Representative"], "jobUrls": ["https://www.linkedin.com/jobs/view/4446291718/"], "loc": ["Pune, Maharashtra, India"], "mode": ["Office"], "urgency": "Low-Medium", "product": "Cloud-based test case management software by Celoxis Technologies. Power-packed with test case authoring, test run management, bug/time tracking integrations, and team collaboration. Described as 'power-packed with everything you want, and nothing that you don't.' Sister product to Celoxis project management.", "icp": "QA teams and developers at software product and services companies needing structured test management without bloat. SMBs and mid-market engineering teams wanting an alternative to TestRail or Jira-based test management.", "funding": "Bootstrapped (Celoxis Technologies parent — profitable, Rs. 38.1Cr revenue FY2025)", "revenue": "Rs. 38.1Cr ($4.5M) for Celoxis Technologies FY2025 (13% revenue CAGR)", "competitors": ["TestRail", "Qase", "PractiTest", "Zephyr (SmartBear)", "TestCollab", "Atlassian JIRA", "SpiraTest", "Kualitee"], "news": "2025: Ranked as top test management tool for QA teams. Parent Celoxis reported Rs. 38.1Cr revenue with 187% EBITDA CAGR.", "gtmMotion": "Inside Sales + PLG (Freemium). Free plan drives adoption; SDR upsells to paid enterprise/teams tiers. Leverages Celoxis brand and customer base as warm leads for Tuskr test management cross-sell. Content marketing (top-ranked blog posts on test management tools 2025/2026).", "salesMotion": "Outbound SDR targeting QA managers and VP Engineering at software companies. Short sales cycles (14-30 days), self-serve-first approach. Price competitive vs. TestRail. SDR in Pune Office.", "gaps": ["Tuskr is not as well-known as TestRail or Qase — outbound SDR needs to overcome low brand awareness", "SDR is selling test management to QA teams — technical buyer who prefers self-serve over sales calls", "Pune SDR pool for SaaS sales is smaller than Bengaluru or Mumbai"], "outreach": "Position as: 'Tuskr by Celoxis is the top-ranked test management software for 2025 — bootstrapped, profitable, trusted by QA teams globally. The SDR role in Pune targets QA managers and Dev leads at software companies. Sell on simplicity vs. complex alternatives like TestRail. Celoxis (project management) customers are warm cross-sell leads.'", "leaders": [{"name": "Ravindra Wankar", "title": "Co-Founder (Celoxis & Tuskr)", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/ravindra-wankar-4a506b1"}, {"name": "Nikhil Daddikar", "title": "Co-Owner / Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/nikhildaddikar"}, {"name": "Mahua Das", "title": "Head of Marketing", "cat": "other", "li": "https://www.linkedin.com/in/mahua-das-37b6448a"}]},
  {"id": 16, "name": "Appitsimple Infotek", "cat": "B2B SaaS / Business Communication / Cloud Telephony / AI Calling", "stage": "Scale-up", "emp": "51-200", "hq": "Ahmedabad, Gujarat", "founded": null, "website": "https://callhippo.com/", "linkedin": "https://www.linkedin.com/company/appitsimple-infotek-pvt-ltd", "about": "AI-first B2B SaaS company building intelligent products. CallHippo is an AI-driven business communication platform powering sales and support teams across 5,000+ customers with cloud telephony, AI agents, sales dialers, unified inbox — offering numbers in 173 countries.", "roles": ["Sales Development Representative", "Sales Development Representative - US"], "jobUrls": ["https://www.linkedin.com/jobs/view/4448871951/", "https://www.linkedin.com/jobs/view/4450259550/"], "loc": ["Ahmedabad, Gujarat, India"], "mode": ["Office"], "urgency": "Medium", "product": "AI-first B2B SaaS company behind CallHippo: an AI-driven business communication platform with cloud telephony, AI calling agents, sales dialers, unified inbox, and 173-country number coverage. Also operates SoftwareSuggest (B2B software discovery). 5,000+ CallHippo customers globally.", "icp": "SMB and mid-market sales and support teams globally (US, India, EU) needing virtual phone infrastructure and AI-powered call automation; companies scaling outbound sales with power dialers; remote-first companies needing cloud PBX.", "funding": "Bootstrapped/Unfunded (profitable at $21-25M revenue)", "revenue": "$25M ARR (Appitsimple); CallHippo: $21.1M ARR", "competitors": ["Aircall", "CloudTalk", "RingCentral", "Zendesk Talk", "Freshcaller", "JustCall", "Talkdesk"], "news": "2025: Expanded AI agents and sales dialer capabilities. Founded in 2017, now 51-200 employees across Ahmedabad HQ and Bengaluru.", "gtmMotion": "Inbound-Led + SDR Outbound. CallHippo acquires most customers via G2/Capterra reviews and Google Ads (inbound SaaS). SDR role likely handles both inbound lead qualification (IQ) and outbound to targeted verticals. Ahmedabad-based company with global (US, EU, India) customer base.", "salesMotion": "High-velocity inside sales targeting sales/support managers at SMBs and mid-market companies globally. Short sales cycles (7-30 days). Demo + free trial → paid conversion. SDR in Ahmedabad Office — likely selling to India and some US SMB accounts.", "gaps": ["Ahmedabad talent market for SaaS sales is smaller and less competitive than Bengaluru/Mumbai/Hyderabad", "CallHippo competes vs. Aircall, JustCall (both India-funded, strong outbound teams) — need sharper SDR messaging", "AI calling agents feature is strong differentiator but needs to be central to SDR pitch"], "outreach": "Position as: 'CallHippo is a profitable $25M ARR AI-first business communication platform used by 5,000+ companies in 173 countries. SDR in Ahmedabad sells to sales managers and founders at SMBs globally. Lead with AI agents + power dialer — that's the competitive edge vs. Aircall and JustCall. Sell the ROI: your AI agent works 24/7 at the cost of one SDR.'", "leaders": [{"name": "Ankit Dudhwewala", "title": "CEO & Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/ankitdudhwewala"}, {"name": "Suhasini Dudhwewala", "title": "Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/suhasini-dudhwewala-724729119"}, {"name": "Gaurang Pujara", "title": "Head of Technology", "cat": "other", "li": "https://www.linkedin.com/in/gaurang-pujara-a0255a282"}]},
  {"id": 17, "name": "DATOMS", "cat": "IoT SaaS / Connected Operations / Equipment-as-a-Service", "stage": "Startup", "emp": "51-200", "hq": "Bengaluru, Karnataka", "founded": "2015", "website": "http://www.datoms.io", "linkedin": "https://www.linkedin.com/company/datoms", "about": "Connecting Machines | Bringing Digital Transformation enabling Equipment as a Service", "roles": ["Sales Development Representative"], "jobUrls": ["https://www.linkedin.com/jobs/view/4448258892/", "https://www.linkedin.com/jobs/view/4449387481/"], "loc": ["Bhubaneswar, Odisha, India"], "mode": ["Office"], "urgency": "Low-Medium", "product": "Industrial IoT SaaS platform enabling Equipment-as-a-Service (EaaS). Connects machines, tracks assets, and delivers operational intelligence for OEMs and system integrators. Features: device management, real-time monitoring, analytics, digital transformation layer for industrial equipment. Target market: $18B global connected machines market.", "icp": "Industrial equipment OEMs and system integrators wanting to add IoT connectivity to their machines (construction, agriculture, energy, manufacturing equipment). Companies transitioning from product sales to equipment-as-a-service recurring revenue models.", "funding": "₹25 crore (~$2.76M) Series A. ₹25 crore Series A led by Big Capital JSC (Vietnam); IvyCap Ventures; YourNest VC. Big Capital JSC, IvyCap Ventures, YourNest Venture Capital", "revenue": "Rs. 5.57Cr ($670K) FY2025 (up from Rs. 3.09Cr FY2024)", "competitors": ["AssetCues", "Fracttal", "FIT Global", "Infinite Uptime", "Proxgy", "Algo8"], "news": "Raised ₹25Cr Series A from Big Capital JSC (Vietnam) and IvyCap. Revenue doubled YoY to Rs. 5.57Cr in FY2025. Hiring SDR in Bhubaneswar for enterprise expansion.", "gtmMotion": "Enterprise B2B Sales (OEM-focused). SDR targeting OEM business development and digital transformation leads. Selling connected machine platform to industrial equipment manufacturers. Bhubaneswar-based company with Bengaluru   {"id": 18, "name": "Darwinbox", "cat": "HR Tech SaaS / HCM / Workforce Management", "stage": "Scale-up", "emp": "1001-5000", "hq": "San Mateo, California", "founded": "2015", "website": "https://www.darwinbox.com", "linkedin": "https://www.linkedin.com/company/darwinbox", "about": "We enable rapidly growing companies & large enterprises with AI-powered HCM for the evolving world of work!", "roles": ["GTM Engineer"], "jobUrls": ["https://www.linkedin.com/jobs/view/4448837966/"], "loc": ["Hyderabad, Telangana, India"], "mode": ["Office"], "urgency": "High — posted 2026-08-05, new Country Head needs GTM support", "product": "AI-powered HCM platform for enterprises and high-growth companies. Full-suite HRMS: payroll, attendance, leaves, performance, talent management, recruitment (ATS), onboarding, people analytics, HR voicebot, and travel/expense. Built for Asia-Pacific enterprises. Unicorn. Backed by Salesforce Ventures.", "icp": "Mid-market to large enterprises (500+ employees) in India, Southeast Asia, and Middle East modernizing legacy HR systems. Companies in IT, BFSI, retail, and manufacturing. Global expansion into North America and Europe.", "funding": "$149M across 13 rounds (some sources: $308M). $15M Series B (most recent; May 2026 per search results — likely earlier round referenced incorrectly). Salesforce Ventures, Sequoia India (Peak XV), Lightspeed India", "revenue": "$100M (2025)", "competitors": ["Workday", "SAP SuccessFactors", "PeopleStrong", "Factorial", "Cornerstone OnDemand", "Keka HR", "greytHR", "Rippling", "Deel"], "news": "July 2026: Appointed Akshay Murthy as VP & Country Head India (ex-Salesforce). April 2025: Named Sudi Bjornstad Korba as SVP North America Sales. Co-CEO model with Chaitanya Peddi and Jayant Paleti.", "gtmMotion": "Enterprise Sales + GTM Engineering. Complex enterprise HCM sale supported by marketing, events, and strategic partnerships. GTM Engineer role signals investment in RevOps/automated outbound infrastructure — Darwinbox building technical GTM stack for scale.", "salesMotion": "Darwinbox's India motion: Darwinbox AE + SDR → enterprise CHRO/CHRO + CIO. GTM Engineer role (Hyderabad, Office) is a RevOps/Growth Engineer role — building automated prospecting, data enrichment, and outbound tooling at scale. Supports $100M revenue enterprise sales org.", "gaps": ["New India Country Head (July 2026) means GTM strategy may be in flux — incoming leader reshaping motion", "GTM Engineer role is technical — finding this skill set in Hyderabad vs. Bengaluru is harder", "Rippling/Deel expansion into India creates unexpected competitive pressure from global HCM newcomers"], "outreach": "Position as: 'Darwinbox is a $100M revenue HCM unicorn with a new India Country Head (ex-Salesforce, July 2026) and hiring a GTM Engineer to scale the tech stack. This is a RevOps + automation role: prospecting systems, data enrichment, outbound tooling, and GTM analytics. High autonomy in a scale-up environment — early mover advantage as the India GTM rebuilds under new leadership.'", "leaders": [{"name": "Chaitanya Peddi", "title": "Co-CEO & Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/chaitanyapeddi"}, {"name": "Jayant Paleti", "title": "Co-CEO & Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/jayantpaleti"}, {"name": "Rohit Chennamaneni", "title": "Co-Founder", "cat": "founder_ceo", "li": "https://www.linkedin.com/in/rohitchennamaneni"}, {"name": "Akshay Murthy", "title": "VP & Country Head, India", "cat": "vp_sales", "li": "https://www.linkedin.com/in/akshaygmurthy"}, {"name": "Sudi Bjornstad Korba", "title": "SVP Sales, North America", "cat": "vp_sales", "li": "https://www.linkedin.com/in/sudibjornstad"}]},

const FREQ_HIRERS = new Set([3, 10, 16, 17]);

const STATUSES = ['new','interested','applied','rejected','parked'];
const STATUS_LABELS = {new:'New',interested:'Interested',applied:'Applied',rejected:'Rejected',parked:'Parked'};

let filters = {stage:'all',urgency:'all',status:'all',freq:'all'};
let searchQuery = '';

function getStatus(id) {
  try { return localStorage.getItem('mi_status_'+id) || 'new'; } catch(e) { return 'new'; }
}
function setStatus(id, s) {
  try { localStorage.setItem('mi_status_'+id, s); } catch(e) {}
}

function normalizeUrgency(u) {
  if (!u) return 'Medium';
  if (u.toLowerCase().includes('high')) return 'High';
  if (u.toLowerCase().includes('low')) return 'Low';
  return 'Medium';
}

function getInitials(name) {
  return name.split(' ').map(w => w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
}

function renderStats() {
  const visible = getFilteredCompanies();
  const total = visible.length;
  const high = visible.filter(c => normalizeUrgency(c.urgency) === 'High').length;
  const interested = visible.filter(c => getStatus(c.id) === 'interested').length;
  const applied = visible.filter(c => getStatus(c.id) === 'applied').length;
  const freq = visible.filter(c => FREQ_HIRERS.has(c.id)).length;
  const remote = visible.filter(c => c.mode.some(m => m.toLowerCase().includes('remote'))).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Companies</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--red)">${high}</div><div class="stat-label">High Urgency</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--blue)">${interested}</div><div class="stat-label">Interested</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${applied}</div><div class="stat-label">Applied</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--purple)">${freq}</div><div class="stat-label">Frequent Hirers</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--teal)">${remote}</div><div class="stat-label">Remote</div></div>
  `;
}

function getFilteredCompanies() {
  return COMPANIES.filter(c => {
    if (filters.stage !== 'all' && c.stage !== filters.stage) return false;
    const u = normalizeUrgency(c.urgency);
    if (filters.urgency !== 'all' && u !== filters.urgency) return false;
    if (filters.status !== 'all' && getStatus(c.id) !== filters.status) return false;
    if (filters.freq === 'freq' && !FREQ_HIRERS.has(c.id)) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const haystack = [c.name, c.cat, c.about, ...c.roles, ...(c.loc||[]), c.product||'', c.icp||''].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

function renderCompanies() {
  const list = document.getElementById('companyList');
  const filtered = getFilteredCompanies();
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">No companies match your filters.</div>';
    renderStats();
    return;
  }

  list.innerHTML = filtered.map(c => {
    const u = normalizeUrgency(c.urgency);
    const urgClass = u === 'High' ? 'pill-urgency-high' : u === 'Low' ? 'pill-urgency-low' : 'pill-urgency-medium';
    const st = getStatus(c.id);
    const isFreq = FREQ_HIRERS.has(c.id);
    const isRemote = c.mode.some(m => m.toLowerCase().includes('remote'));

    return `<div class="company-card" data-id="${c.id}">
      <div class="card-header" onclick="toggleCard(${c.id})">
        <div class="card-left">
          <div class="card-name">
            ${c.name}
            ${isFreq ? '<span class="pill pill-freq">Frequent Hirer</span>' : ''}
          </div>
          <div class="card-category">${c.cat}</div>
          <div class="card-meta">
            <span class="pill pill-stage">${c.stage}</span>
            <span class="pill ${urgClass}">${u} Urgency</span>
            ${isRemote ? '<span class="pill pill-remote">Remote</span>' : ''}
            <span class="pill" style="background:var(--border-light);color:var(--text-secondary)">${c.emp} emp</span>
          </div>
        </div>
        <div class="card-right">
          <div class="status-wrap">
            <button class="status-btn" data-status="${st}" onclick="event.stopPropagation();toggleStatusMenu(${c.id})">${STATUS_LABELS[st]}</button>
            <div class="status-menu" id="smenu-${c.id}">
              ${STATUSES.map(s => `<button onclick="event.stopPropagation();pickStatus(${c.id},'${s}')">${STATUS_LABELS[s]}</button>`).join('')}
            </div>
          </div>
          <svg class="chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="5 8 10 13 15 8"/></svg>
        </div>
      </div>
      <div class="card-detail">
        <div class="detail-tabs" id="tabs-${c.id}">
          <button class="active" onclick="switchTab(${c.id},'overview',this)">Overview</button>
          <button onclick="switchTab(${c.id},'leadership',this)">Leadership</button>
          <button onclick="switchTab(${c.id},'intel',this)">Intelligence</button>
          <button onclick="switchTab(${c.id},'gtm',this)">GTM & Outreach</button>
        </div>
        <div class="tab-content">
          <div class="tab-pane active" id="pane-${c.id}-overview">
            <div class="info-grid">
              <div class="info-item"><div class="info-label">Headquarters</div><div class="info-value">${c.hq || 'N/A'}</div></div>
              <div class="info-item"><div class="info-label">Founded</div><div class="info-value">${c.founded || 'N/A'}</div></div>
              <div class="info-item"><div class="info-label">Employees</div><div class="info-value">${c.emp}</div></div>
              <div class="info-item"><div class="info-label">Website</div><div class="info-value"><a href="${c.website}" target="_blank" rel="noopener">${c.website.replace(/https?:\/\//,'')}</a></div></div>
              <div class="info-item"><div class="info-label">LinkedIn</div><div class="info-value"><a href="${c.linkedin}" target="_blank" rel="noopener">Company Profile</a></div></div>
              <div class="info-item"><div class="info-label">Revenue</div><div class="info-value">${c.revenue || 'Not disclosed'}</div></div>
            </div>
            <div style="margin-top:18px">
              <div class="info-label">About</div>
              <p style="font-size:15px;line-height:1.5;margin-top:4px">${c.about}</p>
            </div>
            <div style="margin-top:16px">
              <div class="info-label">Open Roles</div>
              <div class="roles-list">
                ${c.roles.map((r,i) => `<div class="role-card"><span>${r}</span>${c.jobUrls[i] ? `<a class="role-link" href="${c.jobUrls[i]}" target="_blank" rel="noopener">View Job</a>` : ''}</div>`).join('')}
              </div>
            </div>
          </div>
          <div class="tab-pane" id="pane-${c.id}-leadership">
            <div class="leader-list">
              ${c.leaders.map(l => `<div class="leader-row">
                <div class="leader-avatar" style="background:${l.cat==='founder_ceo'?'var(--blue)':l.cat==='vp_sales'?'var(--green)':l.cat==='head_sales'?'var(--orange)':'var(--purple)'}">${getInitials(l.name)}</div>
                <div class="leader-info">
                  <div class="leader-name">${l.name}</div>
                  <div class="leader-title">${l.title}</div>
                </div>
                ${l.li ? `<a class="leader-link" href="${l.li}" target="_blank" rel="noopener">LinkedIn</a>` : '<span class="leader-link disabled">No Profile</span>'}
              </div>`).join('')}
            </div>
          </div>
          <div class="tab-pane" id="pane-${c.id}-intel">
            <div class="section-block"><h4>Product</h4><p>${c.product}</p></div>
            <div class="section-block"><h4>Ideal Customer Profile</h4><p>${c.icp}</p></div>
            <div class="section-block"><h4>Funding</h4><p>${c.funding}</p></div>
            <div class="section-block"><h4>Recent News</h4><p>${c.news}</p></div>
            <div class="section-block"><h4>Competitors</h4><div class="competitor-tags">${c.competitors.map(x=>`<span class="comp-tag">${x}</span>`).join('')}</div></div>
          </div>
          <div class="tab-pane" id="pane-${c.id}-gtm">
            <div class="section-block"><h4>GTM Motion</h4><p>${c.gtmMotion}</p></div>
            <div class="section-block"><h4>Sales Motion</h4><p>${c.salesMotion}</p></div>
            <div class="section-block"><h4>Observable GTM Gaps</h4>${c.gaps.map(g=>`<div class="gap-item">${g}</div>`).join('')}</div>
            <div class="section-block"><h4>Outreach Angle</h4><div class="outreach-box">${c.outreach}</div></div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  renderStats();
}

function toggleCard(id) {
  const card = document.querySelector(`.company-card[data-id="${id}"]`);
  card.classList.toggle('open');
}

function switchTab(id, tab, btn) {
  const tabs = document.getElementById('tabs-'+id);
  tabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const content = tabs.parentElement.nextElementSibling || tabs.closest('.card-detail').querySelector('.tab-content');
  content.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-'+id+'-'+tab).classList.add('active');
}

function toggleStatusMenu(id) {
  document.querySelectorAll('.status-menu.show').forEach(m => { if (m.id !== 'smenu-'+id) m.classList.remove('show'); });
  document.getElementById('smenu-'+id).classList.toggle('show');
}

function pickStatus(id, status) {
  setStatus(id, status);
  document.getElementById('smenu-'+id).classList.remove('show');
  renderCompanies();
}

document.addEventListener('click', () => {
  document.querySelectorAll('.status-menu.show').forEach(m => m.classList.remove('show'));
});

document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value.trim();
  renderCompanies();
});

document.querySelectorAll('.seg-control').forEach(ctrl => {
  const filterKey = ctrl.dataset.filter;
  ctrl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      ctrl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filters[filterKey] = btn.dataset.val;
      renderCompanies();
    });
  });
});

renderCompanies();
</script>
